project_root
line_length: 120
tab_width: 4
indent_function_file_body: false

# MATLAB conventions: "(1,1)" size declarations and "%NAME" H1 help lines.
suppress_rule: "whitespace_comma"
suppress_rule: "whitespace_comments"
suppress_rule: "copyright_notice"

# Same scheme as the MATLAB naming check.
regex_function_name: "[a-z][a-zA-Z0-9]*"
regex_method_name: "[a-z][a-zA-Z0-9]*"
regex_nested_name: "[a-z][a-zA-Z0-9]*"
regex_parameter_name: "[a-z][a-zA-Z0-9]*"
regex_class_name: "[A-Z][a-zA-Z0-9]*"
